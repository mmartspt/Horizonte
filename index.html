<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MigmaGames – Personagens</title>
<style>
:root{--bg:#0d0f1a;--card:#171a2b;--line:#2b3050;--text:#eef0fa;--mute:#98a0c4;--gold:#e8c46a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1d2250,var(--bg));color:var(--text);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
header{padding:28px 16px 8px;text-align:center}
h1{margin:0;font-size:clamp(1.6rem,5vw,2.6rem);letter-spacing:.04em;font-weight:700}
header p{margin:6px 0 0;color:var(--mute);font-family:system-ui,sans-serif;font-size:.95rem}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:16px}
nav button{font:600 .9rem system-ui,sans-serif;background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
nav button[aria-pressed=true]{background:var(--gold);color:#1a1405;border-color:var(--gold)}
nav button:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;max-width:1200px;margin:0 auto;padding:8px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;padding:0;font:inherit;display:flex;flex-direction:column}
.card:hover{border-color:var(--gold)}
.art{aspect-ratio:2/3;overflow:hidden;background:#000;position:relative}
.art img{width:266.667%;max-width:none;display:block;position:absolute;left:0;top:0;height:100%;object-fit:cover;object-position:left}
.info{padding:12px 14px 14px}
.info h2{margin:0 0 2px;font-size:1.05rem}
.cls{color:var(--gold);font:600 .85rem system-ui,sans-serif}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:10px;font:.82rem system-ui,sans-serif;color:var(--mute)}
.stats b{color:var(--text)}
dialog{border:1px solid var(--gold);border-radius:14px;background:var(--card);color:var(--text);padding:0;max-width:min(92vw,420px);width:100%}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog .art{aspect-ratio:2/3}
dialog .info{padding:16px}
dialog .close{position:absolute;top:8px;right:8px;z-index:2;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:36px;height:36px;font-size:1.2rem;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>MigmaGames</h1>
  <p>Cartas de personagens</p>
</header>
<nav id="filters" aria-label="Filtrar por grupo"></nav>
<main id="grid"></main>
<dialog id="dlg"></dialog>

<script>
/* ===== COMO EDITAR =====
 1) Cada imagem (slide) vai para a pasta images/ com o nome indicado em "img".
 2) A carta mostra só a parte esquerda do slide (o retrato). Não precisas de recortar.
 3) Para adicionar uma personagem, copia uma linha em CHARS.
 4) Estatísticas: usa "stats" numa personagem para mudar os valores da classe. */

const CLASSES = {
  "Guerreiro":  {hp:100, atk:80, def:60, spd:50},
  "Assassino":  {hp:70,  atk:90, def:40, spd:90},
  "Tanque":     {hp:140, atk:50, def:95, spd:30},
  "Berserker":  {hp:110, atk:95, def:45, spd:60},
  "Mago":       {hp:65,  atk:85, def:35, spd:70},
  "Tempestade": {hp:75,  atk:90, def:40, spd:65},
  "Suporte":    {hp:80,  atk:55, def:50, spd:75},
  "Pesado":     {hp:130, atk:75, def:80, spd:35}
};

const CHARS = [
  // Jogáveis
  {name:"The Lady of Death",  cls:"Assassino",  group:"Jogáveis", img:"lady-of-death.webp"},
  {name:"The Lone Duelist",   cls:"Guerreiro",  group:"Jogáveis", img:"lone-duelist.webp"},
  {name:"The Werewolf",       cls:"Tanque",     group:"Jogáveis", img:"werewolf.webp"},
  {name:"The Headless Figure",cls:"Berserker",  group:"Jogáveis", img:"headless-figure.webp"},
  {name:"The Black Elite",    cls:"Assassino",  group:"Jogáveis", img:"black-elite.webp"},
  {name:"The Black Kitten",   cls:"Mago",       group:"Jogáveis", img:"black-kitten.webp"},
  {name:"The Lunar Knight",   cls:"Pesado",     group:"Jogáveis", img:"lunar-knight.webp"},
  {name:"The Charge Knight",  cls:"Guerreiro",  group:"Jogáveis", img:"charge-knight.webp"},
  // Independentes
  {name:"The Witch Of Love",  cls:"Suporte",    group:"Independentes", img:"witch-of-love.webp"},
  {name:"The Viking of Flames",cls:"Pesado",    group:"Independentes", img:"viking-of-flames.webp"},
  {name:"The Ember Halberdier",cls:"Guerreiro", group:"Independentes", img:"ember-halberdier.webp"},
  {name:"The Angry Stormy",   cls:"Tempestade", group:"Independentes", img:"angry-stormy.webp"},
  {name:"The Inca Spirit",    cls:"Guerreiro",  group:"Independentes", img:"inca-spirit.webp"},
  // NPCs (sem classe nem estatísticas)
  {name:"The Market Lady",    role:"NPC", group:"NPCs", img:"market-lady.webp"},
  {name:"The Master Teacher", role:"NPC", group:"NPCs", img:"master-teacher.webp"},
  {name:"The Blacksmith",     role:"NPC", group:"NPCs", img:"blacksmith.webp"},
  {name:"The Library Monster",role:"NPC", group:"NPCs", img:"library-monster.webp"},
  {name:"The Raccoon King",   role:"NPC", group:"NPCs", img:"raccoon-king.webp"}
];

const LABELS = {hp:"Vida", atk:"Ataque", def:"Defesa", spd:"Velocidade"};
const grid = document.getElementById("grid");
const dlg = document.getElementById("dlg");
const filters = document.getElementById("filters");
const groups = ["Todos", ...new Set(CHARS.map(c => c.group))];

function statsOf(c){ return c.cls ? {...CLASSES[c.cls], ...(c.stats||{})} : null; }

function cardHTML(c, big){
  const s = statsOf(c);
  const sub = c.cls || c.role;
  const st = s ? `<div class="stats">${Object.keys(LABELS).map(k => `<span>${LABELS[k]} <b>${s[k]}</b></span>`).join("")}</div>` : "";
  return `<div class="art"><img src="images/${c.img}" alt="${c.name}" ${big?"":'loading="lazy" decoding="async"'}></div>
    <div class="info"><h2>${c.name}</h2><div class="cls">${sub}</div>${st}</div>`;
}

function render(group){
  grid.innerHTML = "";
  CHARS.filter(c => group === "Todos" || c.group === group).forEach(c => {
    const b = document.createElement("button");
    b.className = "card";
    b.innerHTML = cardHTML(c, false);
    b.onclick = () => {
      dlg.innerHTML = `<button class="close" aria-label="Fechar">×</button>` + cardHTML(c, true);
      dlg.querySelector(".close").onclick = () => dlg.close();
      dlg.showModal();
    };
    grid.appendChild(b);
  });
  [...filters.children].forEach(x => x.setAttribute("aria-pressed", x.textContent === group));
}

groups.forEach(g => {
  const b = document.createElement("button");
  b.textContent = g;
  b.onclick = () => render(g);
  filters.appendChild(b);
});
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
render("Todos");
</script>
</body>
</html>
