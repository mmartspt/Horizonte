<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy of Libi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c16;--p:#141930;--p2:#1b2140;--ln:#2a3150;--tx:#eceffa;--mu:#8f98bd;--gd:#e2b85a;--ac:#e2b85a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 50% -10%,#1c2252,var(--bg));color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;padding-bottom:40px}
h1,h2,h3,.cz{font-family:Cinzel,Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
nav.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;padding:10px 12px;background:rgba(10,12,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln);overflow-x:auto}
nav.tabs button,.sub button{background:transparent;border:1px solid var(--ln);border-radius:999px;padding:8px 16px;color:var(--mu);font-weight:600;white-space:nowrap}
nav.tabs button[aria-pressed=true],.sub button[aria-pressed=true]{background:var(--gd);border-color:var(--gd);color:#1a1405}
main{max-width:1000px;margin:0 auto;padding:16px 14px}
h2{font-size:1.5rem;margin:6px 0 14px}
h3{font-size:1.1rem;margin:18px 0 8px;color:var(--gd)}
.muted{color:var(--mu);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.tile:hover{border-color:var(--ac)}
.tile b{font-family:Cinzel,serif;font-size:.95rem}
.ico{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block}
.emb{position:relative;width:76px;height:76px}
.emb .ico{width:76px;height:76px;border:3px solid var(--ac)}
.emb .badge{position:absolute;right:-6px;bottom:-4px;width:30px;height:30px;border:2px solid var(--bg)}
.back-btn{background:none;border:0;color:var(--gd);padding:4px 0 10px;font-weight:600}
.cover{position:relative;aspect-ratio:1/1;max-height:82vh;margin:0 auto;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#1c2252,#0a0c16);display:grid;place-items:center;border:1px solid var(--ln)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.cover h1{font-size:clamp(1.8rem,7vw,3.4rem);letter-spacing:.06em;text-align:center}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
td.v{text-align:right;font-weight:600;white-space:nowrap}
.bar{height:5px;border-radius:3px;background:var(--ln);margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gd)}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card b{color:var(--gd)}
.tag{display:inline-block;font-size:.78rem;border:1px solid var(--ln);border-radius:999px;padding:1px 9px;margin-left:6px;color:var(--mu)}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ch{border:3px solid transparent;background:linear-gradient(var(--p),var(--p)) padding-box,var(--rbg,linear-gradient(var(--ln),var(--ln))) border-box;border-radius:15px;overflow:hidden;padding:0;text-align:left;display:block}
.ch:hover{filter:brightness(1.12)}
.art{aspect-ratio:2/3;background:#0e1124 center/38% no-repeat;position:relative}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ch .inf{padding:8px 10px;display:flex;gap:8px;align-items:center}
.ch .inf .ico{width:28px;height:28px;flex:none}
.ch .inf span{font-size:.85rem;font-weight:600;line-height:1.2}
.view{display:grid;gap:20px;grid-template-columns:minmax(0,340px) 1fr;align-items:start}
@media(max-width:720px){.view{grid-template-columns:1fr}}
.flip{perspective:1000px;max-width:340px;width:100%;margin:0 auto}
.fi{position:relative;aspect-ratio:2/3;transition:transform .6s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;overflow:hidden;border:3px solid transparent;background:linear-gradient(var(--p),var(--p)) padding-box,var(--rbg,linear-gradient(var(--ac),var(--ac))) border-box}
.face.bk{transform:rotateY(180deg);overflow:auto;padding:10px;font-size:.8rem}
.face.bk td{padding:3px 4px}
.face.fr .nm{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 12px;background:linear-gradient(transparent,rgba(5,6,12,.92));display:flex;gap:10px;align-items:center}
.face.fr .nm .ico{width:40px;height:40px;flex:none}
.flipbtn{display:block;margin:12px auto 0;background:var(--gd);color:#1a1405;border:0;border-radius:999px;padding:9px 20px;font-weight:700}
.abs{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
.ab{width:78px;background:none;border:0;text-align:center;font-size:.72rem;color:var(--mu)}
.ab i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 4px;border-radius:50%;background:var(--p2);border:2px solid var(--ln);font:800 .8rem Cinzel,serif;color:var(--gd);font-style:normal}
.ab[aria-pressed=true] i{border-color:var(--gd);background:#2a2f55}
.ab:disabled{opacity:.4}
.lv{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--ln);font-size:.9rem}
.lv b{color:var(--gd)}
.arena{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--ln);margin:8px 0;min-height:430px;padding:8px 4px}
.arena .bg{position:absolute;inset:0;pointer-events:none}
.arena .bg::before{content:"";position:absolute;left:0;right:0;bottom:28%;height:30%;background:var(--mt);clip-path:polygon(0 100%,0 55%,8% 30%,16% 60%,28% 15%,40% 58%,52% 25%,64% 62%,76% 20%,88% 55%,100% 35%,100% 100%)}
.arena .bg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:var(--gr)}
.arena.th-desert{background:radial-gradient(circle at 80% 20%,#fff3c4 0 5%,rgba(255,220,130,.5) 6%,transparent 22%),linear-gradient(#f3a85c,#f7d58a 45%,#f1c57a 70%);--mt:#c7843d;--gr:linear-gradient(#d9a45a,#a8702f)}
.arena.th-hell{background:radial-gradient(circle at 50% 100%,rgba(255,110,20,.55),transparent 55%),linear-gradient(#1a0505,#5a0f06 55%,#2b0a05);--mt:#2a0905;--gr:linear-gradient(#3a0d05,#150402)}
.arena.th-moon{background:radial-gradient(circle at 20% 18%,#fff 0 4%,rgba(200,215,255,.5) 5%,transparent 20%),linear-gradient(#0b1030,#1d2a6b 60%,#101845);--mt:#0f1738;--gr:linear-gradient(#162055,#080c22)}
.arena.th-ice{background:radial-gradient(circle at 72% 18%,#e9fbff 0 4%,rgba(180,240,255,.5) 5%,transparent 20%),linear-gradient(#58a9c9,#a6e0f2 60%,#d5f3fb);--mt:#6fb7d3;--gr:linear-gradient(#e7fbff,#9fd8ea)}
.arena.shk{animation:shk .35s}
.field{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;min-height:414px}
.col{display:flex;flex-direction:column;justify-content:center;gap:6px}
.u{position:relative;width:100%;border:3px solid transparent;background:linear-gradient(var(--p),var(--p)) padding-box,var(--rbg,linear-gradient(var(--ln),var(--ln))) border-box;border-radius:12px;padding:3px;text-align:center;font-size:.62rem;line-height:1.15;display:block;color:var(--tx)}
.u.rem{opacity:.9}
.u.cur{box-shadow:0 0 0 2px #fff,0 0 16px 4px var(--gd);z-index:2}
.u.tg{outline:3px solid #ff6b6b;animation:pulse 1s infinite}
.u.dead{opacity:.3;filter:grayscale(1)}
.u.pet{filter:grayscale(1) contrast(1.25)}
.u.imm{box-shadow:0 0 14px 4px #bff}
.u.shd{box-shadow:0 0 12px 2px rgba(120,210,255,.85)}
.u.stn::before{content:"💫";position:absolute;top:-12px;left:50%;margin-left:-11px;font-size:1.2rem;animation:orb .8s infinite alternate;z-index:4}
.u.orbd::after{content:"";position:absolute;left:50%;top:-12px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:radial-gradient(circle,#000 52%,#d9d0ff 62%,transparent 72%);box-shadow:0 0 10px #a98bff;animation:orb 1.4s infinite alternate;z-index:3}
.u.hit{animation:hitk .3s}
.pt{aspect-ratio:3/4;border-radius:7px;overflow:hidden;background:#0e1124 center/45% no-repeat;position:relative}
.pt img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.pt .cb{position:absolute;left:2px;bottom:2px;width:22px;height:22px;border-radius:50%;border:1px solid #000}
.pt.em,.pt .em{display:grid;place-items:center;font-size:2.4rem;background:#1a1d33;width:100%;height:100%}
.pt.big{width:110px;flex:none;border:3px solid transparent;background:linear-gradient(#0e1124,#0e1124) padding-box,var(--rbg) border-box;border-radius:12px}
.nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;font-weight:600;min-height:2.3em;word-break:break-word}
.hpb{height:7px;border-radius:3px;background:#3a1b26;overflow:hidden;margin:3px 0 1px;position:relative}
.hpb i{display:block;height:100%;background:#4cd37a;transition:width .35s}
.hpb s{position:absolute;left:0;top:0;height:100%;background:rgba(120,200,255,.9);transition:width .35s}
.lvb{display:block;color:var(--gd)}
.chips{min-height:15px;font-size:.66rem}
.fl{position:absolute;left:50%;transform:translateX(-50%);font:800 1.3rem Cinzel,serif;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:0 0 8px rgba(0,0,0,.9);pointer-events:none;z-index:8;white-space:nowrap;animation:fl 1.7s ease-out forwards}
.fl.crit{font-size:1.9rem}.fl.sm{font-size:.8rem;-webkit-text-stroke:1.5px #000}.fl.miss{font-style:italic;font-size:1rem}.fl.heal{font-size:1.4rem}
.fxo,.proj{position:absolute;pointer-events:none;z-index:7}
.ptc{position:absolute;pointer-events:none;z-index:7}
.ins{display:flex;gap:12px;align-items:flex-start}
.efc{display:flex;gap:10px;align-items:center}.efi{font-size:1.7rem}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.pc,.slot{border:3px solid transparent;background:linear-gradient(var(--p),var(--p)) padding-box,var(--rbg,linear-gradient(var(--ln),var(--ln))) border-box;border-radius:12px;padding:3px;text-align:center;font-size:.62rem;line-height:1.15;color:var(--tx)}
.pc small,.slot small{display:block;color:var(--mu)}
.tg2{display:grid;gap:8px}.srow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot.empty{border:2px dashed var(--ln);display:grid;place-items:center;min-height:90px;color:var(--mu);background:none}
.slot input[type=range]{width:100%}
.sb{display:flex;justify-content:space-between;margin-top:3px}.sb button{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:2px 9px;font-size:.8rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.act{display:flex;align-items:center;gap:6px;background:var(--p2);border:2px solid var(--ln);border-radius:12px;padding:6px 12px 6px 6px;font-size:.78rem;text-align:left}
.act img{width:38px;height:38px;border-radius:50%}
.act[aria-pressed=true]{border-color:var(--gd)}.act:disabled{opacity:.4}
.log{max-height:280px;overflow:auto;font-size:.82rem;color:var(--mu);background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:8px}
.log .lh{color:var(--gd);font-weight:700;margin-top:8px;border-top:1px solid var(--ln);padding-top:5px}.log .lr{text-align:center;color:#fff;font-weight:700;margin-top:8px}.log .lp{color:#9ad1ff}
@keyframes fl{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}12%{opacity:1;transform:translate(-50%,0) scale(1.2)}25%{transform:translate(-50%,-4px) scale(1)}100%{opacity:0;transform:translate(-50%,-44px) scale(1)}}
@keyframes shk{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,0)}}
@keyframes hitk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes orb{to{transform:scale(1.2)}}
@keyframes pulse{50%{outline-color:#fff}}
@media (orientation:landscape) and (max-height:520px){.arena{min-height:300px}.field{min-height:284px}.u{font-size:.55rem}}
@media(prefers-reduced-motion:reduce){.fi{transition:none}.u.hit,.fl,.u.tg,.arena.shk,.u.orbd::after,.u.stn::before{animation:none}}
</style>
</head>

const HEROES={"son-of-the-storm": {"a": [{"t": "Main Attack", "n": "Thunder", "cd": "", "l": [[1, "He attacks with a thunder that deals damage to one enemy and ricochets to one additional enemy."], [2, "The thunder can ricochets to one additional random enemy. (25%)"], [3, "The thunder now applies Haste to The Son Of The Storm. Haste Effect: +20% Speed Duration: 1 turn"], [4, "The thunder can ricochets to two additional random enemies. (30%; 15%)"], [5, "The thunder now applies Slow to the principal target. Slow Effect: −20% Speed Duration: 1 turn"]]}, {"t": "Active Skill", "n": "Storm", "cd": "2 rounds cooldown", "l": [[1, "Creates a rain of thunders (level 1), dealing damage to all enemies. This Thunders don't ricochets. Ricochets cannot target the same enemy twice."], [2, "(Thunder level 2);"], [3, "(Thunder level 3)"], [4, "(Thunder level 4)"], [5, "(Thunder level 5)"]]}, {"t": "Passive Skill", "n": "Shock", "cd": "", "l": [[0, "(ricochets don't count)"], [1, "Every 6 normal attacks “thunders”; the next attack+4.5% Damage"], [2, "Every 5 normal attacks “thunders”; the next attack+4.5% Damage"], [3, "Every 5 normal attacks “thunders”; the next attack+9% Damage"], [4, "Every 4 normal attacks “thunders”; the next attack+9% Damage"], [5, "Every 4 normal attacks “thunders”; the next attack+13.5% Damage"]]}, {"t": "Super Skill", "n": "Electric Moon", "cd": "8 rounds cooldown", "l": [[1, "Summons a moon above him for 1 round, granting +20% speed."], [2, "Now the Moon lasts 2 rounds."], [3, "The Moon also increases all damage dealt by 20% and reduces all damage taken by 20%."], [4, "The Moon now slows all enemies and allies at 20% when active"], [5, "Now when the moon is active he has a 20% to counterattack (thunder level 5)"]]}, {"t": "Class & Kingdom Passive", "n": "Thunder Mage", "cd": "", "l": [[0, "Maximum HP reduced by 5%, but deals more 10% damage. Skill damage rises 5%. —-The Spirit Of The Crow"]]}], "lore": "Heir of the Thunder Kingdom, The Son of the Storm com ally) with 20% of the hero’s attack and HP."], [2, "Every 6 attacks;"], [3, "Crows now inflict poison equal to the main attack’s poison effect."], [4, "Crows can also be summoned (33% chance) whenever an enemy is defeated."], [5, "Crows now have 40% of the hero’s attack and HP."]]}, {"t": "Super Skill", "n": "Dark Ritual", "cd": "7 rounds cooldown", "l": [[0, "Ritual triggers at the end of the hero’s turn."], [1, "Creates a ritual that is behind him, casting up to 5 of the hero’s main attacks randomly. Lasts 5 rounds. (20% chance to fail)"], [2, "Ritual attacks become more accurate. (10% chance to fail)"], [3, "The ritual also increases speed by 25%."], [4, "The ritual uses the Level 5 version of Enchanted Paper."], [5, "When the ritual ends, it summons 1 Level 5 Pet Crow."]]}, {"t": "Class & Kingdom Passive", "n": "Thunder Mage", "cd": "", "l": [[0, "Maximum HP reduced by 5%, but deals more 10% damage. Skill damage rises 5%."]]}], "lore": "A silent occultist bound to death and decay, The Spirit of the Crow spreads fear and poison wherever he strikes. His curses weaken enemies over time, while spectral crows gather around him, feeding on fallen foes. The longer the battle lasts, the closer victory crawls—inevitable, patient, and merciless. Role: Curse Mage / Summoner Strengths: Damage over time, fear effects, attrition warfare Playstyle: Slowly overwhelms enemies through poison, summons, and cascading deaths"}, "paladin-of-heaven": {"a": [{"t": "Main Attack", "n": "Attack from the Skies", "cd": "", "l": [[1, "He attacks by leaping with his spear and inflicting damage on one enemy."], [2, "the spear pierces the enemy's defense (15%)"], [3, "When attacking, he recovers 2.5% of the max HP of the ally with lowest HP."], [4, "His divine spear also causes 4 light effects that apply to himself. Light Effect: When stacked up to 10 → auto-cures (25% Max HP) and reset When he is attacked→ loses 1 Light"], [5, "Now when attacking, he recovers 5% of the max HP of the ally with function insp(){const u=P.u.find(x=>x.id===P.ins)||P.cur;if(!u)return'';const E=fxList(u);
 return `<h3>Inspect</h3><div class="card ins"><div class="pt big" style="--rbg:${u.rem?'linear-gradient(#5a5f75,#5a5f75)':RB(u.c)};background-image:url(${ci(u.c.c)})">${u.rem?`<div class="em">${u.em}</div>`:`<img src="images/${u.c.id}.webp" alt="" onerror="this.style.display='none'">`}</div><div style="flex:1;min-width:0"><div class="cz" style="font-weight:800;font-size:1.05rem">${esc(u.n)}</div><div class="row" style="margin:4px 0"><img class="ico" style="width:28px;height:28px" src="${ci(u.c.c)}" alt=""><span>${u.c.c}</span>${u.c.r?`<span class="tag">${u.c.r}</span>`:''}${u.rem?'':`<span class="tag">Lv ${u.lv}</span>`}</div><div>HP ${Math.round(u.hp)}/${Math.round(u.mh)}${u.bar>0?' · 🛡 '+Math.round(u.bar):''} · Speed ${Math.round(spd(u))}</div>${u.rem?'':`<details open><summary class="muted">Stats</summary><table>${G.map(x=>`<tr><td>${x[1]}</td><td class="v">${fmt(x[0],Math.round(u.s[x[0]]*10)/10)}</td></tr>`).join('')}</table></details>`}</div></div>`+
 `<h3>Active effects</h3>`+(E.length?E.map(x=>`<div class="card efc"><span class="efi">${x.s}</span><div><b>${x.n}</b><span class="tag">${x.d>=50?'until triggered':x.d+' round'+(x.d>1?'s':'')+' left'}</span><div class="muted">${x.t}</div></div></div>`).join(''):'<p class="muted">No active effects.</p>')+
 (u.ab.length?`<h3>Abilities</h3>`:'')+u.ab.map((a,i)=>`<div class="card"><div class="row" style="margin:0"><img class="ico" style="width:44px;height:44px" src="${aIc(u.c,i)}" alt=""><div><b>${esc(a.n)}</b><span class="tag">${a.t}</span>${a.cd?`<span class="tag">Cooldown ${a.cd}${a.s&&u.cd[i]?' (ready in '+u.cd[i]+')':''}</span>`:''}</div></div><div class="muted" style="margin-top:6px">${esc(a.d)}</div></div>`).join('')}
function slotCard(k,i,x){if(!x)return `<div class="slot empty">empty</div>`;const c=CH.find(y=>y.id===x.id),mx=maxLv(c);return `<div class="slot" style="--rbg:${RB(c)}"><div class="pt" style="background-image:url(${ci(c.c)})"><img src="images/${c.id}.webp" alt="" onerror="this.style.display='none'"><img class="cb" src="${ci(c.c)}" alt=""></div><span class="nm">${esc(SH(c.n))}</span><small>${c.r||''}</small>${P.same?`<small>Lv ${lvOf(c,x)}</small>`:`<label><small>Lv <b class="lvn">${Math.min(x.lv,mx)}</b>/${mx}</small><input type="range" data-slv="${k}:${i}" min="1" max="${mx}" value="${Math.min(x.lv,mx)}"></label>`}<div class="sb"><button data-mv="${k}:${i}" aria-label="Move to the other row">⇄</button><button data-rm="${k}:${i}" aria-label="Remove">×</button></div></div>`}
const teamGrid=k=>{const L=P[k],fr=L.slice(0,P.F),bk=L.slice(P.F);return `<div class="tg2"><div><small class="muted">Front row</small><div class="srow">${fr.map((x,i)=>slotCard(k,i,x)).join('')}</div></div><div><small class="muted">Back row</small><div class="srow">${bk.map((x,i)=>slotCard(k,i+P.F,x)).join('')}</div></div></div>`};
function vPlay(){
 if(P.ph==='setup'){const pool=POOL().filter(c=>P.flt==='all'||c.k===P.flt);
  return `<h2>Play</h2><p class="muted">Pick any heroes for both sides. You can repeat them. Front row takes the hits, back row stays safer.</p>
<div class="card"><b>Formation</b> <div class="acts"><button class="act" data-form="3:3" aria-pressed="${P.F===3}">3 front + 3 back (6)</button><button class="act" data-form="2:3" aria-pressed="${P.F===2}">2 front + 3 back (5)</button></div></div>
<h3>Pick heroes</h3><div class="acts"><button class="act" data-to="A" aria-pressed="${P.add==='A'}">Add to: my team</button><button class="act" data-to="B" aria-pressed="${P.add==='B'}">Add to: enemy team</button></div>
<div class="acts">${Object.keys(KF).map(k=>`<button class="act" data-flt="${k}" aria-pressed="${P.flt===k}">${KF[k]}</button>`).join('')}</div>
<div class="pgrid">${pool.map(c=>`<button class="pc" data-pool="${c.id}" style="--rbg:${RB(c)}"><div class="pt" style="background-image:url(${ci(c.c)})"><img src="images/${c.id}.webp" alt="" onerror="this.style.display='none'"><img class="cb" src="${ci(c.c)}" alt=""></div><span class="nm">${esc(SH(c.n))}</span><small>${c.r}</small></button>`).join('')}</div>
<h3>My team (left)</h3>${teamGrid('A')}<h3>Enemy team (right)</h3>${teamGrid('B')}
<div class="card" style="margin-top:14px"><div class="acts"><button class="act" data-same="1" aria-pressed="${P.same}">Same level for everyone (max 50): ${P.same?'ON':'OFF'}</button></div>${P.same?`<label>Level <b id="plvn">${P.lv}</b> / 50<input type="range" id="plv" min="1" max="50" value="${P.lv}" style="width:100%"></label>`:'<p class="muted">Each hero uses the level you set on its slot, up to that hero\'s maximum.</p>'}</div>
<h3>Scenery</h3><div class="acts">${[['desert','Desert'],['hell','Inferno'],['moon','Moonlit'],['ice','Ice']].map(x=>`<button class="act" data-th="${x[0]}" aria-pressed="${P.th===x[0]}">${x[1]}</button>`).join('')}</div>
<h3>AI and sound</h3><div class="acts">${aiBtns()}${tgl()}</div><button class="flipbtn" data-start="1">Start battle</button>`}
 const u=P.cur,col=(t,r)=>`<div class="col" id="col${t}${r}">${P.u.filter(x=>x.team===t&&(r==='f'?(x.row==='f'||x.rem):(x.row==='b'&&!x.rem))).sort((a,b)=>a.slot-b.slot).map(uc).join('')}</div>`;
 let h=`<div class="row"><b class="cz">Round ${P.rd}</b><span class="muted">${P.ph==='end'?'Battle over':'Turn: '+esc(u.n)+' ('+(u.team===1?'my team':'enemy')+')'}</span><button class="back-btn" data-setup="1" style="margin-left:auto">Setup</button></div><div class="arena th-${P.th}" id="arena"><div class="bg"></div><div class="field">${col(1,'b')}${col(1,'f')}${col(2,'f')}${col(2,'b')}</div></div>`;
 if(P.ph==='end')h+=`<div class="card"><b class="cz">${P.win===1?'Victory!':P.win===2?'Defeat':'Draw'}</b></div><button class="flipbtn" data-again="1">Rematch</button><div class="acts">${tgl()}</div>`;
 else h+=`<div id="acts">${human(u)?`<div class="acts">${u.ab.map((a,i)=>a.s?`<button class="act" data-ac="${i}" aria-pressed="${P.arm===i}" ${canUse(u,i)?'':'disabled'}><img src="${aIc(u.c,i)}" alt=""><span>${esc(a.n)}${a.cd?`<br><small>${u.cd[i]?'Cooldown '+u.cd[i]:'Cooldown '+a.cd}</small>`:''}</span></button>`:'').join('')}</div><p class="muted">${P.arm!==null?'Tap a highlighted enemy to attack it.':'Pick an ability. Tap any unit to inspect it.'}</p>`:'<p class="muted">🤖 The AI is playing this turn. Tap any unit to inspect it.</p>'}<div class="acts">${aiBtns()}${tgl()}</div></div>`;
 return h+`<h3>Actions</h3><div class="log" id="log">${P.log.map(logLine).join('')}</div>`+insp()}

function draw(){nav();$('#app').innerHTML=({cover:vCover,classes:vClasses,stats:vStats,kingdoms:vKingdoms,play:vPlay})[S.tab]()}
$('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(S.tab==='play'){playClick(b);return}const d=b.dataset;
 if('cls' in d)S.cls=d.cls||null;
 if('sub' in d)S.sub=d.sub;
 if('kid' in d){S.kid=d.kid||null;S.cid=null}
 if('cid' in d){S.cid=d.cid||null;S.ab=0;S.flip=false}
 if('ab' in d)S.ab=+d.ab;
 if('flip' in d)S.flip=!S.flip;
 const y=scrollY;draw();if('flip' in d||'ab' in d)scrollTo(0,y)};
$('#app').oninput=e=>{const t=e.target;if(t.id==='lv'){S.lv=+t.value;$('#lvn').textContent=S.lv;$('#bk').innerHTML=tbl(CH.find(x=>x.id===S.cid))}playInput(t)};
draw();
</script>
</body>
</html>
