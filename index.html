<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy of Libi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c16;--p:#141930;--p2:#1b2140;--ln:#2a3150;--tx:#eceffa;--mu:#8f98bd;--gd:#e2b85a;--ac:#e2b85a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 50% -10%,#1c2252,var(--bg));color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;padding-bottom:40px}
h1,h2,h3,.cz{font-family:Cinzel,Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
nav.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;padding:10px 12px;background:rgba(10,12,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln);overflow-x:auto}
nav.tabs button,.sub button{background:transparent;border:1px solid var(--ln);border-radius:999px;padding:8px 16px;color:var(--mu);font-weight:600;white-space:nowrap}
nav.tabs button[aria-pressed=true],.sub button[aria-pressed=true]{background:var(--gd);border-color:var(--gd);color:#1a1405}
main{max-width:1000px;margin:0 auto;padding:16px 14px}
h2{font-size:1.5rem;margin:6px 0 14px}
h3{font-size:1.1rem;margin:18px 0 8px;color:var(--gd)}
.muted{color:var(--mu);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.tile:hover{border-color:var(--ac)}
.tile b{font-family:Cinzel,serif;font-size:.95rem}
.ico{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block}
.emb{position:relative;width:76px;height:76px}
.emb .ico{width:76px;height:76px;border:3px solid var(--ac)}
.emb .badge{position:absolute;right:-6px;bottom:-4px;width:30px;height:30px;border:2px solid var(--bg)}
.back-btn{background:none;border:0;color:var(--gd);padding:4px 0 10px;font-weight:600}
.cover{position:relative;aspect-ratio:1/1;max-height:82vh;margin:0 auto;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#1c2252,#0a0c16);display:grid;place-items:center;border:1px solid var(--ln)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.cover h1{font-size:clamp(1.8rem,7vw,3.4rem);letter-spacing:.06em;text-align:center}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
td.v{text-align:right;font-weight:600;white-space:nowrap}
.bar{height:5px;border-radius:3px;background:var(--ln);margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gd)}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card b{color:var(--gd)}
.tag{display:inline-block;font-size:.78rem;border:1px solid var(--ln);border-radius:999px;padding:1px 9px;margin-left:6px;color:var(--mu)}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ch{border:3px solid transparent;background:linear-gradient(var(--p),var(--p)) padding-box,var(--rbg,linear-gradient(var(--ln),var(--ln))) border-box;border-radius:15px;overflow:hidden;padding:0;text-align:left;display:block}
.ch:hover{filter:brightness(1.12)}
.art{aspect-ratio:2/3;background:#0e1124 center/38% no-repeat;position:relative}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ch .inf{padding:8px 10px;display:flex;gap:8px;align-items:center}
.ch .inf .ico{width:28px;height:28px;flex:none}
.ch .inf span{font-size:.85rem;font-weight:600;line-height:1.2}
.view{display:grid;gap:20px;grid-template-columns:minmax(0,340px) 1fr;align-items:start}
@media(max-width:720px){.view{grid-template-columns:1fr}}
.flip{perspective:1000px;max-width:340px;width:100%;margin:0 auto}
.fi{position:relative;aspect-ratio:2/3;transition:transform .6s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;overflow:hidden;border:3px solid transparent;background:linear-gradient(var(--p),var(--p)) padding-box,var(--rbg,linear-gradient(var(--ac),var(--ac))) border-box}
.face.bk{transform:rotateY(180deg);overflow:auto;padding:10px;font-size:.8rem}
.face.bk td{padding:3px 4px}
.face.fr .nm{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 12px;background:linear-gradient(transparent,rgba(5,6,12,.92));display:flex;gap:10px;align-items:center}
.face.fr .nm .ico{width:40px;height:40px;flex:none}
.flipbtn{display:block;margin:12px auto 0;background:var(--gd);color:#1a1405;border:0;border-radius:999px;padding:9px 20px;font-weight:700}
.abs{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
.ab{width:78px;background:none;border:0;text-align:center;font-size:.72rem;color:var(--mu)}
.ab i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 4px;border-radius:50%;background:var(--p2);border:2px solid var(--ln);font:800 .8rem Cinzel,serif;color:var(--gd);font-style:normal}
.ab[aria-pressed=true] i{border-color:var(--gd);background:#2a2f55}
.ab:disabled{opacity:.4}
.lv{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--ln);font-size:.9rem}
.lv b{color:var(--gd)}
.arena{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--ln);background:radial-gradient(900px 420px at 50% 50%,#2a3170 0%,#141838 55%,#0a0c16 100%);padding:8px 5px;margin:8px 0}
.arena.shk{animation:shk .35s}
.arena::before{content:"VS";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:800 2rem Cinzel,serif;color:rgba(255,255,255,.07);pointer-events:none}
.trow{display:flex;gap:4px;justify-content:center;margin:10px 0}
.u{position:relative;flex:1 1 0;min-width:0;max-width:112px;border:3px solid transparent;background:linear-gradient(var(--p),var(--p)) padding-box,var(--rbg,linear-gradient(var(--ln),var(--ln))) border-box;border-radius:12px;padding:3px;text-align:center;font-size:.6rem;line-height:1.15;display:block;color:var(--tx)}
.u.rem{max-width:64px;opacity:.85}
.u.cur{box-shadow:0 0 0 2px #fff,0 0 16px 4px var(--gd);transform:translateY(-5px);z-index:2}
.u.tg{outline:3px solid #ff6b6b;animation:pulse 1s infinite}
.u.dead{opacity:.3;filter:grayscale(1)}
.u.pet{filter:grayscale(1) contrast(1.25)}
.u.imm{box-shadow:0 0 14px 4px #bff}
.u.orbd::after{content:"";position:absolute;left:50%;top:-9px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:radial-gradient(circle,#000 52%,#d9d0ff 62%,transparent 72%);box-shadow:0 0 10px #a98bff;animation:orb 1.4s infinite alternate;z-index:3}
.u.hit{animation:hitk .3s}
.pt{aspect-ratio:3/4;border-radius:7px;overflow:hidden;background:#0e1124 center/45% no-repeat;position:relative}
.pt img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.pt .cb{position:absolute;left:2px;bottom:2px;width:20px;height:20px;border-radius:50%;border:1px solid #000}
.pt.big{width:110px;flex:none;border:3px solid transparent;background:linear-gradient(#0e1124,#0e1124) padding-box,var(--rbg) border-box;border-radius:12px}
.nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;font-weight:600;min-height:2.3em;word-break:break-word}
.hpb{height:6px;border-radius:3px;background:#3a1b26;overflow:hidden;margin:3px 0 1px;position:relative}
.hpb i{display:block;height:100%;background:#4cd37a;transition:width .35s}
.hpb s{position:absolute;left:0;top:0;height:100%;background:rgba(120,200,255,.9);transition:width .35s}
.chips{min-height:15px;font-size:.62rem}
.fl{position:absolute;left:50%;font:800 1.2rem Cinzel,serif;text-shadow:0 1px 3px #000,0 0 6px #000;pointer-events:none;z-index:6;white-space:nowrap;animation:fl 1.25s ease-out forwards}
.fxo,.proj{position:absolute;pointer-events:none;z-index:7}
.ins{display:flex;gap:12px;align-items:flex-start}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.sl,.pk{display:flex;align-items:center;gap:6px;background:var(--p);border:2px solid var(--ln);border-radius:999px;padding:3px 12px 3px 3px;font-size:.8rem}
.sl{border:3px solid transparent;background:linear-gradient(var(--p),var(--p)) padding-box,var(--rbg,linear-gradient(var(--ln),var(--ln))) border-box}
.sl img,.pk img{width:28px;height:28px;border-radius:50%}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pk:disabled{opacity:.4}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.act{display:flex;align-items:center;gap:6px;background:var(--p2);border:2px solid var(--ln);border-radius:12px;padding:5px 12px 5px 5px;font-size:.78rem;text-align:left}
.act img{width:38px;height:38px;border-radius:50%}
.act[aria-pressed=true]{border-color:var(--gd)}.act:disabled{opacity:.4}
.log{max-height:260px;overflow:auto;font-size:.82rem;color:var(--mu);background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:8px}
@keyframes fl{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
@keyframes shk{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,0)}}
@keyframes hitk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes orb{to{transform:scale(1.2)}}
@keyframes pulse{50%{outline-color:#fff}}
@media(prefers-reduced-motion:reduce){.fi{transition:none}.u.hit,.fl,.u.tg,.arena.shk,.u.orbd::after{animation:none}}
</style>
</head>

const HEROES={"son-of-the-storm": {"a": [{"t": "Main Attack", "n": "Thunder", "cd": "", "l": [[1, "He attacks with a thunder that deals damage to one enemy and ricochets to one additional enemy."], [2, "The thunder can ricochets to one additional random enemy. (25%)"], [3, "The thunder now applies Haste to The Son Of The Storm. Haste Effect: +20% Speed Duration: 1 turn"], [4, "The thunder can ricochets to two additional random enemies. (30%; 15%)"], [5, "The thunder now applies Slow to the principal target. Slow Effect: −20% Speed Duration: 1 turn"]]}, {"t": "Active Skill", "n": "Storm", "cd": "2 rounds cooldown", "l": [[1, "Creates a rain of thunders (level 1), dealing damage to all enemies. This Thunders don't ricochets. Ricochets cannot target the same enemy twice."], [2, "(Thunder level 2);"], [3, "(Thunder level 3)"], [4, "(Thunder level 4)"], [5, "(Thunder level 5)"]]}, {"t": "Passive Skill", "n": "Shock", "cd": "", "l": [[0, "(ricochets don't count)"], [1, "Every 6 normal attacks “thunders”; the next attack+4.5% Damage"], [2, "Every 5 normal attacks “thunders”; the next attack+4.5% Damage"], [3, "Every 5 normal attacks “thunders”; the next attack+9% Damage"], [4, "Every 4 normal attacks “thunders”; the next attack+9% Damage"], [5, "Every 4 normal attacks “thunders”; the next attack+13.5% Damage"]]}, {"t": "Super Skill", "n": "Electric Moon", "cd": "8 rounds cooldown", "l": [[1, "Summons a moon above him for 1 round, granting +20% speed."], [2, "Now the Moon lasts 2 rounds."], [3, "The Moon also increases all damage dealt by 20% and reduces all damage taken by 20%."], [4, "The Moon now slows all enemies and allies at 20% when active"], [5, "Now when the moon is active he has a 20% to counterattack (thunder level 5)"]]}, {"t": "Class & Kingdom Passive", "n": "Thunder Mage", "cd": "", "l": [[0, "Maximum HP reduced by 5%, but deals more 10% damage. Skill damage rises 5%. —-The Spirit Of The Crow"]]}], "lore": "Heir of the Thunder Kingdom, The Son of the Storm commands lightning as both weapon and will. His attacks leap between enemies, accelerating his own movements while disrupting the flow of battle. As the fight drags on, his power builds relentlessly—until the Electric Moon rises and the battlefield bends to the storm’s rhythm. Role: Control Mage Strengths: Speed manipulation, area pressure, sustained damage Playstyle: Dictates turn order, weakens enemy formations, dominates long fights"}, "spirit-of-the-crow": {"a": [{"t": "Main Attack", "n": "Enchanted Paper", "cd": "", "l": [[1, "Launches a magical projectile that deals damage to an enemy."], [2, "The projectile poisons the enemy for 1 turn. Poison level 1 Effect: Loses 3% of Max HP per turn Stacking: Up to 2 stacks Duration: 1 turn"], [3, "Now applies poisons level 2 Poison level 2 Effect: Loses 4.5% of Max HP per turn Stacking: Up to 2 stacks Duration: 2 turn"], [4, "If the enemy is below 35% max HP, all damage taken is increased by 10%."], [5, "If an enemy dies while poisoned by him, he restores 5% of his maximum HP."]]}, {"t": "Active Skill", "n": "Crow’s Curse", "cd": "3 rounds cooldown", "l": [[0, "The curse transfer does NOT refresh cooldown nor re-trigger fear immediately."], [1, "Attacks an enemy with a curse, causing them to fear for one round. Fear level 1 Effect: 25% chance to lose action Stacking: No Duration: 1 turn"], [2, "Now the curse poisons the enemy. Poison level 1 Effect: Loses 3% of Max HP per turn Stacking: Up to 2 stacks Duration: 1 turn"], [3, "Now applies fear level 2. Fear level 2 Effect: 33% chance to lose action Stacking: No Duration: 1 turn"], [4, "Now the curse poison is level 2 Poison level 2 Effect: Loses 4.5% of Max HP per turn Stacking: Up to 2 stacks Duration: 2 turn"], [5, "If an enemy dies from the curse, the curse transfers to another random enemy."]]}, {"t": "Passive Skill", "n": "Pet Crow", "cd": "", "l": [[0, "Maximum 2 active summoned units per hero. Extra summons replace the oldest."], [1, "Every 7 attacks, summons a crow (     float(el,(e.tag&&e.tag!=='dot'?e.tag+' ':'')+e.v+(e.cr?'!':''),TAGC[e.tag||(e.cr?'crit':'n')]||TAGC.n,e.cr);if(e.ab)float(el,'🛡'+e.ab,'#7fc8ff');sfx(e.cr?'crit':e.tag==='dot'?'dot':'hit');if(e.cr)shake();upd(U);await sleep(e.f?120:440)}break;
  case 'miss':float(el,'Miss','#aab4d6');sfx('miss');await sleep(380);break;
  case 'imm':float(el,'Immune','#bff');await sleep(300);break;
  case 'bar':if(U){if(e.bar>U.db){sfx('shield')}U.db=e.bar;U.dm=e.mh;upd(U)}break;
  case 'hpset':if(U){U.dh=e.hp;U.db=e.bar;U.dm=e.mh;upd(U)}break;
  case 'fx':if(el){if(SYM[e.f]){float(el,SYM[e.f],'#fff');sfx(DEB.includes(e.f)?'debuff':'buff')}else if(e.f==='hourglass'){float(el,'⌛','#fff');sfx('buff')}else if(e.f==='rest'){float(el,'💤','#fff')}
    fxAt(el,e.f==='lunar'?'lunar':e.f==='shield'?'shield':e.f==='sand'?'sand':e.f==='mark'?'mark':DEB.includes(e.f)?'curse':'buff');if(e.f==='shield')sfx('shield');if(e.f==='lunar')sfx('orb');await sleep(300)}break;
  case 'dead':if(U){U.dd=true;U.dh=0;upd(U);if(el)el.classList.add('dead');sfx('die');await sleep(380)}break;
  case 'spawn':{const row=document.querySelector('#row'+e.team);if(row){row.insertAdjacentHTML('beforeend',e.html);sfx('buff')}await sleep(250)}break;
  case 'sfx':sfx(e.n);await sleep(400);break}}
async function flush(){P.busy=true;const q=EV;EV=[];const a=document.querySelector('#acts');if(a)a.style.opacity=.3;
 try{for(const e of q)await run(e)}catch(x){console.error(x)}
 P.busy=false;P.u.forEach(u=>{u.dh=Math.max(0,u.hp);u.db=u.bar;u.dm=u.mh;u.chipsH=chipsH(u);u.cls=clsOf(u);u.dd=u.hp<=0});
 if(S.tab==='play')draw();if(P.auto&&P.ph==='battle')setTimeout(autoLoop,500)}
/* ---------- sound (synthesised, no files needed) ---------- */
let AC=null,MGN=null,MUS=null,MT=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MGN=AC.createGain();MGN.gain.value=.55;MGN.connect(AC.destination)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,ty,v,sl,t0,mu){const a=ac();if(!a||!(mu?P.mus:P.sfxOn))return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(t0||0);o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,sl),t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MGN);o.start(t);o.stop(t+d+.03)}
function noise(d,v,f){const a=ac();if(!a||!P.sfxOn)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain(),fl=a.createBiquadFilter();s.buffer=b;fl.type='lowpass';fl.frequency.value=f||2000;g.gain.value=v||.2;s.connect(fl);fl.connect(g);g.connect(MGN);s.start()}
const SFXD={slash:()=>{noise(.18,.22,2600);tone(420,.14,'sawtooth',.06,140)},smash:()=>{tone(110,.28,'square',.18,40);noise(.2,.3,600)},shot:()=>{noise(.1,.3,4200);tone(900,.12,'square',.08,200)},bolt:()=>tone(300,.3,'sawtooth',.07,1300),laser:()=>tone(1600,.55,'sawtooth',.07,200),
 hit:()=>{tone(180,.14,'square',.14,70);noise(.07,.18,900)},crit:()=>{tone(220,.2,'square',.16,60);tone(880,.15,'triangle',.1,1400);noise(.12,.25,1500)},miss:()=>{noise(.2,.1,1200);tone(500,.15,'sine',.04,250)},dot:()=>tone(200,.2,'sine',.09,120),
 shield:()=>{tone(500,.3,'triangle',.1,900);tone(750,.3,'triangle',.07,1200,.06)},buff:()=>{tone(523,.12,'triangle',.09);tone(784,.18,'triangle',.09,null,.1)},debuff:()=>tone(400,.25,'sawtooth',.07,150),die:()=>tone(300,.55,'sawtooth',.12,40),orb:()=>{tone(80,.8,'sine',.2,260);noise(.4,.12,500)},cast:()=>tone(660,.08,'sine',.06),
 win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.12,null,i*.16)),lose:()=>[392,330,262].forEach((f,i)=>tone(f,.45,'sawtooth',.08,null,i*.25))};
function sfx(n){const f=SFXD[n];if(f&&P.sfxOn)try{f()}catch(e){}}
function synthMusic(){const a=ac();if(!a||MT)return;const N=[57,60,64,60,57,60,64,67,55,59,62,59,55,59,62,65,53,57,60,57,53,57,60,64,52,55,59,55,52,55,59,62],f=m=>440*Math.pow(2,(m-69)/12);let i=0;MT=setInterval(()=>{if(!P.mus)return;const m=N[i%N.length];tone(f(m),.4,'triangle',.04,null,0,1);if(i%8===0){tone(f(m-24),2.2,'sine',.06,null,0,1);tone(f(m-12),2.2,'sine',.03,null,0,1)}i++},300)}
function musicStart(){if(!P.mus||MUS||MT)return;ac();const a=new Audio('music.mp3');a.loop=true;a.volume=.45;let fb=0;const go=()=>{if(!fb){fb=1;synthMusic()}};a.addEventListener('error',go);a.play().then(()=>{MUS=a}).catch(e=>{if(e.name!=='NotAllowedError')go()})}
function musicStop(){if(MUS){MUS.pause();MUS=null}if(MT){clearInterval(MT);MT=null}}
/* ---------- views ---------- */
function playClick(b){if(P.busy)return;const d=b.dataset;ac();
 if(d.add){const p=d.add.split(':');if(P[p[0]].length<5)P[p[0]].push(p[1])}
 else if(d.rm){const p=d.rm.split(':');P[p[0]].splice(+p[1],1)}
 else if(d.start){if(P.A.length&&P.B.length){musicStart();startBattle();return}}
 else if(d.mus){P.mus=!P.mus;if(P.mus)musicStart();else musicStop()}
 else if(d.sfx){P.sfxOn=!P.sfxOn}
 else if(d.u){const t=P.u.find(x=>x.id===d.u);if(P.cur&&tgOK(t)){doUse(P.arm,t);return}P.ins=d.u}
 else if(d.ac!==undefined){const i=+d.ac;if(!P.cur||!canUse(P.cur,i))return;if(needT(P.cur,i))P.arm=P.arm===i?null:i;else{doUse(i);return}}
 else if(d.auto){autoTurn();return}
 else if(d.autoall){P.auto=!P.auto;if(P.auto){draw();autoLoop();return}}
 else if(d.setup){P.ph='setup';P.auto=false;musicStop()}
 else if(d.again){startBattle();return}
 draw()}
const tgl=()=>`<button class="act" data-mus="1" aria-pressed="${P.mus}">♪ Music ${P.mus?'on':'off'}</button><button class="act" data-sfx="1" aria-pressed="${P.sfxOn}">🔊 Effects ${P.sfxOn?'on':'off'}</button>`;
const uc=u=>{const hp=Math.max(0,u.dh/u.dm*100),b=Math.min(100,u.db/u.dm*100);
 return `<button class="u${P.cur===u?' cur':''}${u.dd?' dead':''}${u.rem?' rem':''}${tgOK(u)?' tg':''} ${u.cls||''}" data-u="${u.id}" style="--rbg:${rb(u.c.r)||'linear-gradient(#2a3150,#2a3150)'}"><div class="pt" style="background-image:url(${ci(u.c.c)})"><img src="images/${u.c.id}.webp" alt="" onerror="this.style.display='none'"><img class="cb" src="${ci(u.c.c)}" alt=""></div><span class="nm">${esc(u.n)}</span><div class="hpb"><i class="hpf" style="width:${hp}%"></i><s class="bf" style="width:${b}%"></s></div><small class="hpt">${Math.round(Math.max(0,u.dh))}/${Math.round(u.dm)}</small><div class="chips">${u.chipsH}</div></button>`};
function insp(){const u=P.u.find(x=>x.id===P.ins)||P.cur;if(!u)return'';
 return `<h3>Inspect</h3><div class="card ins"><div class="pt big" style="--rbg:${rb(u.c.r)||'linear-gradient(#2a3150,#2a3150)'};background-image:url(${ci(u.c.c)})"><img src="images/${u.c.id}.webp" alt="" onerror="this.style.display='none'"></div><div style="flex:1;min-width:0"><div class="cz" style="font-weight:800">${esc(u.n)}</div><div class="row" style="margin:4px 0"><img class="ico" style="width:28px;height:28px" src="${ci(u.c.c)}" alt=""><span>${u.c.c}</span>${u.c.r?`<span class="tag">${u.c.r}</span>`:''}</div><div>HP ${Math.round(u.hp)}/${Math.round(u.mh)}${u.bar>0?' · 🛡 '+Math.round(u.bar):''} · Speed ${Math.round(spd(u))}</div><div class="chips">${chipsH(u)}</div><details><summary class="muted">All stats (level ${lvOf(u.c)})</summary><table>${G.map(x=>`<tr><td>${x[1]}</td><td class="v">${fmt(x[0],Math.round(u.s[x[0]]*10)/10)}</td></tr>`).join('')}</table></details></div></div>`+u.ab.map((a,i)=>`<div class="card"><div class="row" style="margin:0"><img class="ico" style="width:44px;height:44px" src="${aIc(u.c,i)}" alt=""><div><b>${esc(a.n)}</b><span class="tag">${a.t}</span>${a.cd?`<span class="tag">Cooldown ${a.cd}${a.s&&u.cd[i]?' (ready in '+u.cd[i]+')':''}</span>`:''}</div></div><div class="muted" style="margin-top:6px">${esc(a.d)}</div></div>`).join('')}
function vPlay(){
 if(P.ph==='setup'){const pool=k=>k==='A'?ALLY():FOE(),sec=(k,lab)=>`<h3>${lab} (${P[k].length}/5)</h3><div class="slots">${P[k].map((id,i)=>{const c=CH.find(x=>x.id===id);return `<button class="sl" data-rm="${k}:${i}" style="--rbg:${rb(c.r)}"><img src="${ci(c.c)}" alt="">${esc(SH(c.n))} ×</button>`}).join('')||'<span class="muted">Empty. Add units below.</span>'}</div><div class="pick" style="margin-top:8px">${pool(k).map(c=>`<button class="pk" data-add="${k}:${c.id}" ${P[k].length>=5?'disabled':''}><img src="${ci(c.c)}" alt="">${esc(SH(c.n))} +</button>`).join('')}</div>`;
  return `<h2>Play</h2><p class="muted">Pick 1 to 5 units per side. You can repeat units. You control both sides, turn by turn.</p>${sec('A','Your team (Desert Kingdom)')}${sec('B','Enemy team (The Plagues)')}<div class="card" style="margin-top:14px"><label>Battle level for everyone <b id="plvn">${P.lv}</b> / 50<input type="range" id="plv" min="1" max="50" value="${P.lv}" style="width:100%"></label></div><div class="acts">${tgl()}</div><button class="flipbtn" data-start="1">Start battle</button>`}
 const u=P.cur,row=t=>`<div class="trow" id="row${t}">${P.u.filter(x=>x.team===t).map(uc).join('')}</div>`;
 let h=`<div class="row"><b class="cz">Round ${P.rd}</b><span class="muted">${P.ph==='end'?'Battle over':'Turn: '+esc(u.n)+' ('+(u.team===1?'bottom':'top')+' team)'}</span><button class="back-btn" data-setup="1" style="margin-left:auto">Setup</button></div><div class="arena" id="arena">${row(2)}${row(1)}</div>`;
 if(P.ph==='end')h+=`<div class="card"><b class="cz">${P.win===1?'Victory!':P.win===2?'Defeat':'Draw'}</b></div><button class="flipbtn" data-again="1">Rematch</button><div class="acts">${tgl()}</div>`;
 else h+=`<div id="acts"><div class="acts">${u.ab.map((a,i)=>a.s?`<button class="act" data-ac="${i}" aria-pressed="${P.arm===i}" ${canUse(u,i)?'':'disabled'}><img src="${aIc(u.c,i)}" alt=""><span>${esc(a.n)}${a.cd?`<br><small>${u.cd[i]?'Cooldown '+u.cd[i]:'Cooldown '+a.cd}</small>`:''}</span></button>`:'').join('')}</div><p class="muted">${P.arm!==null?'Tap a highlighted enemy to attack it.':'Pick an ability. Tap any unit to inspect it.'}</p><div class="acts"><button class="act" data-auto="1">Auto turn (AI)</button><button class="act" data-autoall="1" aria-pressed="${P.auto}">Watch AI play</button>${tgl()}</div></div>`;
 return h+`<h3>Actions</h3><div class="log" id="log">${P.log.map(esc).join('<br>')}</div>`+insp()}

function draw(){nav();$('#app').innerHTML=({cover:vCover,classes:vClasses,stats:vStats,kingdoms:vKingdoms,play:vPlay})[S.tab]()}
$('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(S.tab==='play'){playClick(b);return}const d=b.dataset;
 if('cls' in d)S.cls=d.cls||null;
 if('sub' in d)S.sub=d.sub;
 if('kid' in d){S.kid=d.kid||null;S.cid=null}
 if('cid' in d){S.cid=d.cid||null;S.ab=0;S.flip=false}
 if('ab' in d)S.ab=+d.ab;
 if('flip' in d)S.flip=!S.flip;
 const y=scrollY;draw();if('flip' in d||'ab' in d)scrollTo(0,y)};
$('#app').oninput=e=>{const t=e.target;if(t.id==='lv'){S.lv=+t.value;$('#lvn').textContent=S.lv;$('#bk').innerHTML=tbl(CH.find(x=>x.id===S.cid))}if(t.id==='plv'){P.lv=+t.value;$('#plvn').textContent=P.lv}};
draw();
</script>
